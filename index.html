<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuing Education — Data Science Lab, University of Bern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --accent:#e4003c;
  --red-dark:#c30034;
  --ink:#000;
  --muted:#575756;
  --line:#dadada;
  --grey-2:#878787;
  --grey-3:#b3b2b2;
  --font:"Frutiger LT Std","Frutiger Neue LT Std",Frutiger,"Source Sans 3",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{display:flex;flex-direction:column;min-height:100vh;background:#fff;color:var(--ink);
     font-family:var(--font);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}

.topbar{display:flex;align-items:center;padding:18px 32px;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:14px;}
.brand .logo{height:56px;width:auto;padding-right:14px;border-right:1px solid var(--line);}
.brand b{font-size:17px;font-weight:600;letter-spacing:-.01em;}

main{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:96px 32px;}
.kicker{color:var(--accent);margin-bottom:14px;}
h1{font-size:48px;font-weight:600;letter-spacing:-.015em;line-height:1.1;max-width:800px;}
.lede{color:var(--muted);font-size:19px;line-height:1.55;max-width:640px;margin-top:24px;}
.btn{display:inline-block;margin-top:32px;padding:13px 26px;font-size:15px;font-weight:600;
     background:var(--accent);color:#fff;}
.btn:hover{background:var(--red-dark);}

.footer{background:var(--ink);color:var(--grey-3);padding:56px 32px 32px;}
.footer .inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;}
.footer .mark{width:5px;height:34px;background:var(--accent);}
.footer b{display:block;color:#fff;font-size:17px;font-weight:600;line-height:1.2;}
.footer span{display:block;font-size:13px;color:var(--grey-2);line-height:1.2;}

@media (max-width:900px){
  .topbar{padding:14px 20px;}
  main{padding:56px 20px;}
  h1{font-size:34px;}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">
    <img class="logo" src="img/logo_unibern.png" alt="Universität Bern" width="360" height="276">
    <b>Data Science Lab</b>
  </a>
</div>

<main>
  <p class="kicker">Continuing education</p>
  <h1>Coming soon</h1>
  <p class="lede">Continuing education programmes in data science and artificial intelligence.</p>
  <a class="btn" href="aicp.html">CAS in Artificial Intelligence for Creative Practices</a>
</main>

<div class="footer">
  <div class="inner">
    <span class="mark"></span>
    <span><b>Data Science Lab</b><span>Universität Bern</span></span>
  </div>
</div>

</body>
</html>
